<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas</title><style>body{font:16px system-ui;background:#10151b;color:#f3f4f6;padding:28px;max-width:900px;margin:auto}small{color:#9ca3af}.card{background:#1a232d;border:1px solid #344454;border-radius:14px;padding:20px;margin:18px 0}button{background:#fbbf24;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}input{background:#10151b;color:#fff;border:1px solid #536579;border-radius:7px;padding:10px;margin:4px;width:42%}pre{white-space:pre-wrap;color:#fde68a}</style><h1>Atlas</h1><small>Enterprise decision graph · HydraDB entity resolution</small><div class=card><p>Resolve aliases, inspect project conflicts, and preserve evidence paths.</p><input id=project value=Phoenix placeholder=Project><button onclick="projectQ()">Resolve project</button><br><input id=alias value=@sam placeholder=Alias><button onclick="aliasQ()">Resolve alias</button><pre id=o>Ready.</pre></div><script>async function projectQ(){q('/answer/project',{name:project.value})}async function aliasQ(){q('/answer/alias',{value:alias.value})}async function q(path,b){o.textContent='Querying HydraDB…';let r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});o.textContent=JSON.stringify(await r.json(),null,2)}</script>
